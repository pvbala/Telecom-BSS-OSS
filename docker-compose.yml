services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: telecom_prototype
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "True"
      POSTGRES_DB: telecom_prototype
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
